name: Fetch Launch Calendar

on:
  schedule:
    - cron: '30 */2 * * *'   # every 2h, offset 30min from closures fetch
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch all-agency launch calendar
        run: node scripts/fetch-calendar.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json
          git diff --cached --quiet || git commit -m "chore: update launch calendar [skip ci]"
          git push
