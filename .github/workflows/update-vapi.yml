name: Update VesselAPI positions

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days; script tiers vessels by cadence (~114 of 150 free calls/month)
  workflow_dispatch:          # manual trigger
    inputs:
      only:
        description: 'Poll only these MMSIs (comma-separated), ignoring the tier schedule'
        required: false
        type: string
      dry:
        description: 'Probe only — do not write or commit data/vapi-positions.json'
        required: false
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch VesselAPI positions
        env:
          VAPI_KEY: ${{ secrets.VAPI_KEY }}
          ONLY: ${{ inputs.only }}
          DRY:  ${{ inputs.dry }}
        # Inputs go through env rather than straight into the run line, so a value
        # containing shell metacharacters can't break out. Empty on schedule runs,
        # which then behave exactly as before.
        run: |
          args=()
          if [ -n "$ONLY" ]; then args+=("--only=$ONLY"); fi
          if [ "$DRY" = "true" ]; then args+=("--dry"); fi
          node scripts/fetch-vapi.js ${args[@]+"${args[@]}"}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vapi-positions.json
          git diff --cached --quiet || git commit -m "chore: update VesselAPI positions [skip ci]"
          git push
