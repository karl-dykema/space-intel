name: Update VesselAPI positions

on:
  schedule:
    - cron: '0 6 */3 * *'   # every 3 days (~10 runs/month × 10 vessels = ~100 of 150 free calls)
  workflow_dispatch:          # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch VesselAPI positions
        env:
          VAPI_KEY: ${{ secrets.VAPI_KEY }}
        run: node scripts/fetch-vapi.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vapi-positions.json
          git diff --cached --quiet || git commit -m "chore: update VesselAPI positions [skip ci]"
          git push
