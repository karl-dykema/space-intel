name: Fetch Closures & TFRs

on:
  schedule:
    - cron: '0 */6 * * *'   # 4x/day (every 6 hours)
  workflow_dispatch:          # manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch Cameron County closures and FAA TFRs
        run: node scripts/fetch-closures.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/closures.json
          git diff --cached --quiet || git commit -m "chore: update closures/TFR data [skip ci]"
          git push
